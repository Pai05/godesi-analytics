# Scheduled production rebuild: every day at 06:00 IST (00:30 UTC).
# Same as running "dbt build --target prod" by hand: the incremental fact table merges
# new lines, the snapshot records price changes, tests run, and Power BI / Streamlit
# read the fresh marts afterwards.
name: dbt prod daily

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:            # "Run workflow" button in the Actions tab

concurrency:
  group: dbt-prod
  cancel-in-progress: false     # never cancel a prod run half-way

permissions:
  contents: read

jobs:
  dbt-build-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: godesi
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/.github/dbt
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dbt.txt

      - name: Install dbt
        run: pip install -r ../requirements-dbt.txt

      - name: Write the Snowflake key to a temp file
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > "$RUNNER_TEMP/snowflake_key.p8"
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$RUNNER_TEMP/snowflake_key.p8" >> "$GITHUB_ENV"

      - name: dbt deps
        run: dbt deps

      - name: dbt build --target prod
        run: dbt build --target prod
