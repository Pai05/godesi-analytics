name: godesi
version: "1.0.0"
profile: godesi            # matches the profile name in ~/.dbt/profiles.yml

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: ["target", "dbt_packages"]

# Schema routing (see macros/generate_schema_name.sql):
#   target dev  -> everything in GODESI_ANALYTICS.DBT_DEV
#   target prod -> STAGING / INTERMEDIATE / MARTS / SNAPSHOTS
models:
  godesi:
    +persist_docs:          # copy descriptions into Snowflake comments
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging"]
    intermediate:
      +materialized: view
      +schema: intermediate
      +tags: ["intermediate"]
    marts:
      +materialized: table
      +schema: marts
      +tags: ["marts"]
      +grants:                  # BI tools read the marts through the REPORTER role
        select: ["REPORTER"]

seeds:
  godesi:
    +schema: staging

snapshots:
  godesi:
    +schema: snapshots
