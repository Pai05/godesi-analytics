models:
  - name: mart_sales_daily
    description: Daily sales by channel, region and category (Q1, Q4). Grain - day x channel x region x category.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_date, channel, region, category]

  - name: mart_channel_performance
    description: Monthly channel KPIs - revenue share, AOV, discount, returns, margin, MoM growth (Q3). Grain - month x channel.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [month_start, channel]
    columns:
      - name: aov_inr
        description: Average order value = net revenue / orders.
      - name: revenue_share_pct
        description: This channel's share of the month's total net revenue.
      - name: mom_growth_pct
        description: Net revenue growth vs the previous month, same channel. NULL for the first month.

  - name: mart_product_performance
    description: Monthly SKU revenue, units and margin with rank (Q2). Grain - month x SKU.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [month_start, sku_id]

  - name: mart_customer_cohorts
    description: Website retention by first-order month (Q5). Grain - cohort month x months since first order.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cohort_month, months_since_first_order]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "months_since_first_order != 0 or retention_pct = 100"
    columns:
      - name: retention_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100

  - name: mart_promo_impact
    description: >
      Promotion lift (Q7) - average daily net revenue during each promo vs the 28 days
      before, in the channels it ran on. Festival promos also include festival demand.
      Grain - one row per promotion.
    columns:
      - name: promo_code
        data_tests: [unique, not_null]
      - name: revenue_lift_pct
        description: (during / before - 1) x 100. NULL when there is no data before the promo.

  - name: mart_inventory_health
    description: >
      Stock health (Q6) - stock on hand across warehouses vs recent demand.
      Grain - one row per day x SKU.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [snapshot_date, sku_id]
    columns:
      - name: days_of_cover
        description: Stock on hand / average daily units sold over the last 28 days.
      - name: stock_status
        description: Stock-out (any warehouse empty), Low (< 7 days cover), Overstock (> 60 days), else Healthy.
        data_tests:
          - accepted_values:
              arguments:
                values: ["Stock-out", "Low", "Overstock", "Healthy"]

  - name: mart_market_landscape
    description: >
      Real Open Food Facts data - each brand's product count, typical sugar and energy per
      100 g and share of D/E Nutri-Scores (Q8, Q9). Grain - one row per brand.
    columns:
      - name: brand_name
        data_tests: [unique, not_null]
