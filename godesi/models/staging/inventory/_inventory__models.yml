models:
  - name: stg_inventory__stock_daily
    description: Closing stock. One row per snapshot_date x warehouse_id x sku_id.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [snapshot_date, warehouse_id, sku_id]
    columns:
      - name: stock_snapshot_id
        description: Surrogate key (hash of date, warehouse and SKU).
        data_tests: [unique, not_null]
      - name: warehouse_id
        data_tests:
          - accepted_values:
              arguments:
                values: ["WH-BLR", "WH-MUM", "WH-DEL"]
      - name: sku_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_erp__products')
                field: sku_id
      - name: on_hand_units
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
