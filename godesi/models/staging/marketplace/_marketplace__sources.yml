sources:
  - name: marketplace
    description: Seller-portal exports from Amazon, Flipkart, Blinkit, Zepto and Swiggy Instamart (synthetic).
    database: GODESI_RAW
    schema: MARKETPLACE
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 1, period: day}
    tables:
      - name: orders
        description: >
          Marketplace order headers, all channels in one table. Amazon dates carry a
          +05:30 offset; Flipkart statuses are upper-case. Later batches add newer rows
          for the same order.
      - name: order_items
        description: >
          Marketplace order lines. seller_sku is the barcode on Amazon / Flipkart and the
          GoDesi sku_id (inconsistent case and spaces) on quick-commerce apps. Contains
          some exact duplicate rows.
